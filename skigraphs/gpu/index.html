<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duchy | Wykresy narciarskie</title>
  <script type="module" crossorigin src="./assets/tgpuVertexFn-C_AGyn8d.js"></script>
  <script type="module" crossorigin src="./assets/map-CkGKUfEB.js"></script>
  <script type="module" crossorigin src="./assets/main-BEHjcZg1.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/tgpuVertexFn-BUj_fVG1.css">
  <link rel="stylesheet" crossorigin href="./assets/map-DRZ-Otfa.css">
</head>
<body>
<div id="map" class="layer"></div>
<canvas id="ghosts" class="layer overlay"></canvas>
<div class="status" id="status">Wczytywanie duchów…</div>

<aside class="panel">
  <nav class="views" aria-label="Widoki"></nav>
  <h1>Duchy na stoku</h1>
  <p class="sub">Wszystkie dni na nartach w Austrii odtworzone w tym samym czasie</p>

  <div class="clock"><b id="clock">--:--</b><span id="active">&nbsp;</span></div>
  <div class="transport">
    <button id="play" aria-label="Pauza">❚❚</button>
    <input type="range" id="scrub" step="1" aria-label="Pora dnia">
  </div>

  <div class="row">
    <span class="label">Prędkość odtwarzania</span>
    <div class="seg" data-control="speed">
      <button aria-pressed="false" data-value="120">2 min/s</button>
      <button aria-pressed="true" data-value="300">5 min/s</button>
      <button aria-pressed="false" data-value="900">15 min/s</button>
    </div>
  </div>
  <div class="row">
    <span class="label">Smuga</span>
    <div class="seg" data-control="trail">
      <button aria-pressed="false" data-value="short">5 min</button>
      <button aria-pressed="true" data-value="long">30 min</button>
      <button aria-pressed="false" data-value="day">Cały dzień</button>
    </div>
  </div>
  <div class="row">
    <span class="label">Koloruj według</span>
    <div class="seg" data-control="color">
      <button aria-pressed="true" data-value="speed">Prędkość</button>
      <button aria-pressed="false" data-value="season">Sezon</button>
    </div>
  </div>
  <div class="row">
    <span class="label">Sezony</span>
    <div class="chips" id="seasons"></div>
  </div>
  <div class="row">
    <label class="check"><input type="checkbox" id="lifts" checked> Pokaż wjazdy wyciągami</label>
  </div>
  <div class="legend" id="legend"></div>
</aside>

</body>
</html>
